[package]
name = "mouse-battery"
version = "2.1.0"
edition = "2021"
description = "Wireless mouse battery level on the Windows taskbar"
publish = false

[[bin]]
name = "MouseBattery"
path = "src/main.rs"

[dependencies]
hidapi = "2.6"
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
strip = true
